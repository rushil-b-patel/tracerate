[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracerate"
version = "1.3.0"
description = "A no-nonsense CLI internet speed tester"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<1.0",
    "typer>=0.25,<1.0",
    "rich>=15,<16",
]
readme = "README.md"
license = "MIT"
authors = [
    { name = "Rushil B Patel", email = "rushil13579@gmail.com" },
]
keywords = ["internet", "speed", "test", "cli", "command-line"]

[project.urls]
repository = "https://github.com/rushil-b-patel/tracerate"

[project.scripts]
tracerate = "tracerate.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
